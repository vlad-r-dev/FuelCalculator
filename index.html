<html lang="ua">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/images/logo.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <title>Калькулятор витрати пального | Розрахунок онлайн</title>
    <meta name="description" content="Простий калькулятор витрати пального | Розрахуйте середню витрату бензину або дизеля на 100 км, та отримайте корисні поради для економії палива.">
</head>
<body>
    <button id="theme-toggle">🌙</button>
    <header>
        <div class="name">
            <h1>Розхід Пального</h1>
        </div>
    </header>

    <div class="marquee">
        <div class="marquee-text">
            ⛽ Швидкий розрахунок витрати пального • Залишок у баку • Запас ходу • Плануйте поїздки легко •
        </div>
    </div>
    
    <main>
        <div class="container">

            <div class="tip">
                <h2>💡Порада дня</h2>
                <p id="tip"></p>
            </div>

            <div class="content">
                <div class="input">
                    <label>⛽ Розхід палива л/100км</label>
                    <input type="number" id="consumption" placeholder="Наприклад: 7.5">
                    <label>🛢️ Кількість літрів у баці</label>
                    <input type="number" id="fuel" placeholder="Наприклад: 40">
                    <label>🛣️ Відстань, яку треба проїхати (км)</label>
                    <input type="number" id="distance" placeholder="Наприклад: 350">
                </div>
                <div class="buttons">
                    <button id="calculate">Розрахувати</button>
                    <button type="reset" id="reset">Очистити</button>
                </div>

                <div class="output">
                    <label>📊 Результат:</label>
                    <p id="result"></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-container">
            <p class="footer-copyright">
                Independent team &copy; 2026 Всі права захищені. Створено розробником
                <a href="https://github.com/vlad-r-dev" target="_blank" rel="noopener noreferrer" class="github-link" >vlad-r-dev</a>
            </p>
            <span class="version">v1.3</span>
        </div>
    </footer>

    <div id="toast"></div>

    <script src="script.js"></script>
    <script src="tips.js"></script>
</body>
</html>
