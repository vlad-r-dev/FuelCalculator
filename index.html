<!DOCTYPE html>
<html lang="ua">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Калькулятор Пального</title>
</head>
<body>
    
    <div class="name">
        <h1>Розхід Пального</h1>
    </div>
    
    <main>
        <div class="content">
            <div class="input">
                <label>⛽ Розхід палива л/100км</label>
                <input type="number" id="consumption">
                <label>🛢️ Кількість літрів у баці</label>
                <input type="number" id="fuel">
                <label>🛣️ Відстань, яку треба проїхати (км)</label>
                <input type="number" id="distance">
                <button id="calculate">Розрахувати</button>
            </div>

            <div class="output">
                <label>📊 Результат:</label>
                <p id="result"></p>
            </div>
        </div>

    </main>

    <footer>
        Independent team; 2026 Всі права захищені.<br></br>
        Сайт створений розробником <a href="https://github.com/vlad-r-dev" target="_blank">vlad-r-dev</a>.<br></br>
        v1.0
    </footer>

    <script src="script.js"></script>
</body>
</html>
