<!DOCTYPE html>
<html lang="ua">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Калькулятор Пального</title>
</head>
<body>
    
    <div class="name">
        <h1>Розхід Пального</h1>
    </div>
    
    <main>
        <div class="content">
            <div class="input">
                <label>Введіть:</label>
                <label>Розхід палива л/100км</label>
                <input type="number">
                <label>Кількість літрів у баці</label>
                <input type="number">
                <label>Відстань, яку треба проїхати (км)</label>
                <input type="number">
                <button>Розрахувати</button>
            </div>

            <div class="output">
                <h2>Результат:</h2>
                <p>Ви витратите [...] л. палива</p>
            </div>
        </div>

    </main>

</body>
</html>
