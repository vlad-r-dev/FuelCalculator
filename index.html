<!DOCTYPE html>
<html lang="ua">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/images/logo.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <title>Калькулятор Пального</title>
</head>
<body>
    
    <div class="name">
        <h1>Розхід Пального</h1>
    </div>

    <div class="marquee">
        <div class="marquee-text">
            ⛽ Швидкий розрахунок витрати пального • Залишок у баку • Запас ходу • Плануйте поїздки легко •
        </div>
    </div>
    
    <main>
        <div class="content">
            <div class="input">
                <label>⛽ Розхід палива л/100км</label>
                <input type="number" id="consumption">
                <label>🛢️ Кількість літрів у баці</label>
                <input type="number" id="fuel">
                <label>🛣️ Відстань, яку треба проїхати (км)</label>
                <input type="number" id="distance">
            </div>
            <div class="buttons">
                <button id="calculate">Розрахувати</button>
                <button type="reset" id="reset">Очистити</button>
            </div>

            <div class="output">
                <label>📊 Результат:</label>
                <p id="result"></p>
            </div>
        </div>

    </main>

    <footer>
        Independent team; 2026 Всі права захищені.<br></br>
        Сайт створений розробником <a href="https://github.com/vlad-r-dev" target="_blank">vlad-r-dev</a>.<br></br>
        v1.1
    </footer>

    <div id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
